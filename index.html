<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Passage - Click to Reveal</title>
  
  <!-- Inter & Playfair Display Google Fonts for crisp typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Outfit', -apple-system, sans-serif;
      background: #475569;
      position: relative;
    }

    .sky-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      /* Starts misty grey-blue, shifts to vibrant sunny azure when skies clear */
      background: linear-gradient(180deg, #64748b 0%, #94a3b8 45%, #cbd5e1 100%);
      transition: background 3.5s cubic-bezier(0.16, 1, 0.3, 1), filter 3.5s ease;
    }

    .sky-bg.cleared {
      background: linear-gradient(180deg, #0284c7 0%, #38bdf8 55%, #bae6fd 100%);
    }

    /* Ambient Sun flare emerging behind the clouds */
    .sun-flare {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.5) 0%, rgba(253, 224, 71, 0.2) 40%, rgba(255, 255, 255, 0) 75%);
      filter: blur(40px);
      opacity: 0;
      transition: opacity 3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
      pointer-events: none;
    }

    .sun-flare.visible {
      opacity: 1;
    }

    .message-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      pointer-events: none;
    }

    .message-container {
      max-width: 780px;
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      transition: opacity 2s cubic-bezier(0.16, 1, 0.3, 1), transform 2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .message-container.revealed {
      opacity: 1;
      transform: translateY(0px) scale(1);
      pointer-events: auto;
    }

    .tag-badge {
      display: inline-block;
      padding: 6px 18px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e0f2fe;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 4.8rem);
      font-weight: 600;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 1.25rem;
      text-shadow: 0 4px 25px rgba(2, 132, 199, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.95);
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.6;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .clouds-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.96) 20%, rgba(241, 245, 249, 0.85) 60%, rgba(255, 255, 255, 0) 90%);
      border-radius: 50%;
      filter: blur(28px);
      transition: transform 3.8s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 3s ease-out;
      will-change: transform, opacity;
    }

    /* Strategic positioning of overlapping cloud banks */
    .c1 { width: 90vw; height: 80vh; top: -25vh; left: -20vw; }
    .c2 { width: 85vw; height: 75vh; bottom: -20vh; left: -20vw; }
    .c3 { width: 90vw; height: 85vh; top: -20vh; right: -25vw; }
    .c4 { width: 80vw; height: 80vh; bottom: -25vh; right: -20vw; }
    .c5 { width: 75vw; height: 65vh; top: 18vh; left: 12vw; }
    .c6 { width: 60vw; height: 50vh; top: 32vh; right: 10vw; }

    /* Parting animation triggered after user click */
    .cleared .c1 { transform: translate(-55vw, -45vh); opacity: 0; }
    .cleared .c2 { transform: translate(-55vw, 45vh); opacity: 0; }
    .cleared .c3 { transform: translate(55vw, -45vh); opacity: 0; }
    .cleared .c4 { transform: translate(55vw, 45vh); opacity: 0; }
    .cleared .c5 { transform: translate(-30vw, -20vh) scale(0.6); opacity: 0; }
    .cleared .c6 { transform: translate(30vw, 20vh) scale(0.6); opacity: 0; }

    .click-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 24px 34px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease, background 0.3s;
      animation: gentleFloat 3s ease-in-out infinite;
    }

    .click-prompt:hover {
      transform: translate(-50%, -50%) scale(1.06);
      background: rgba(15, 23, 42, 0.65);
    }

    .click-prompt:active {
      transform: translate(-50%, -50%) scale(0.98);
    }

    .click-prompt.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.85);
    }

    .prompt-icon {
      font-size: 2rem;
      animation: pulsePlane 2s ease-in-out infinite;
    }

    .prompt-text {
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .prompt-subtext {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      font-weight: 400;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, -54%); }
    }

    @keyframes pulsePlane {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px) rotate(3deg); }
    }

    .flight-zone {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .airplane-wrap {
      position: absolute;
      width: 68px;
      height: 68px;
      top: 65%;
      left: -120px;
      display: none;
      transform-origin: center center;
    }

    .airplane-wrap.flying {
      display: block;
      animation: flyCurve 4.8s cubic-bezier(0.35, 0, 0.25, 1) forwards;
    }

    .airplane-svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.25));
    }

    /* Dual exhaust contrail ribbons */
    .contrail {
      position: absolute;
      right: 58px;
      height: 3px;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.7) 70%, rgba(255,255,255,0.95) 100%);
      border-radius: 9999px;
      filter: blur(1.5px);
      transform-origin: right center;
      animation: trailVanish 1.2s ease-out infinite;
    }

    .contrail.top { top: 27px; width: 70px; }
    .contrail.bottom { top: 38px; width: 70px; }

    @keyframes flyCurve {
      0% {
        left: -120px;
        top: 72%;
        transform: rotate(26deg) scale(0.9);
      }
      45% {
        top: 42%;
        transform: rotate(18deg) scale(1.05);
      }
      100% {
        left: 112vw;
        top: 14%;
        transform: rotate(10deg) scale(0.95);
      }
    }

    .replay-control {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .replay-control.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .replay-button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 24px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(12px);
      border-radius: 9999px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      transition: background 0.2s, transform 0.2s;
    }

    .replay-button:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.04);
    }

    .replay-button:active {
      transform: scale(0.97);
    }

    .replay-button svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- Background Sky Atmosphere -->
  <div class="sky-bg" id="skyBg"></div>

  <!-- Sun Glow Revealed Behind Clouds -->
  <div class="sun-flare" id="sunFlare"></div>

  <!-- Layer 1: The Hidden Message to be Discovered -->
  <main class="message-stage">
    <div class="message-container" id="message">
      <span class="tag-badge">Skies Cleared</span>
      <h1 class="headline">Pare ton Niko</h1>
      <p class="subtitle">
      </p>
    </div>
  </main>

  <!-- Layer 2: Dense Layered Clouds initially obscuring everything -->
  <div class="clouds-layer" id="cloudsLayer">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="cloud c5"></div>
    <div class="cloud c6"></div>
  </div>

  <!-- Interactive Call-To-Action: Click to trigger sequence -->
  <div class="click-prompt" id="clickPrompt">
    <div class="prompt-icon">✈️</div>
    <div class="prompt-text">Click to clear the skies</div>
  </div>

  <!-- Layer 3: Airplane & Exhaust Trails -->
  <div class="flight-zone">
    <div class="airplane-wrap" id="planeWrap">
      <div class="contrail top"></div>
      <div class="contrail bottom"></div>
      <svg class="airplane-svg" viewBox="0 0 24 24">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
    </div>
  </div>

  <!-- Floating Replay Action -->
  <div class="replay-control" id="replayControl">
    <button class="replay-button" id="replayBtn">
      <svg viewBox="0 0 24 24">
        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
      </svg>
      Replay Flight
    </button>
  </div>

  <script>
    // Cached DOM Nodes
    const skyBg = document.getElementById('skyBg');
    const sunFlare = document.getElementById('sunFlare');
    const cloudsLayer = document.getElementById('cloudsLayer');
    const message = document.getElementById('message');
    const clickPrompt = document.getElementById('clickPrompt');
    const planeWrap = document.getElementById('planeWrap');
    const replayControl = document.getElementById('replayControl');
    const replayBtn = document.getElementById('replayBtn');

    let isRevealed = false;

    // Trigger the Flight & Sky Clearing Sequence
    function triggerClearSequence() {
      if (isRevealed) return;
      isRevealed = true;

      // 1. Immediately hide the interactive prompt
      clickPrompt.classList.add('hidden');

      // 2. Launch the airplane flight across the sky
      planeWrap.classList.remove('flying');
      void planeWrap.offsetWidth; // Force CSS DOM reflow
      planeWrap.classList.add('flying');

      // 3. As plane slices through the mid-clouds (~1.3s in), trigger the parting effect
      setTimeout(() => {
        cloudsLayer.classList.add('cleared');
        skyBg.classList.add('cleared');
        sunFlare.classList.add('visible');
      }, 1300);

      // 4. Reveal the central message cleanly behind the parted clouds (~2.2s in)
      setTimeout(() => {
        message.classList.add('revealed');
      }, 2200);

      // 5. Present the replay button after flight completes
      setTimeout(() => {
        replayControl.classList.add('visible');
      }, 4500);
    }

    // Reset everything back to the initial cloudy state
    function resetToCloudyState() {
      isRevealed = false;

      // Hide replay and revealed elements
      replayControl.classList.remove('visible');
      message.classList.remove('revealed');
      sunFlare.classList.remove('visible');
      skyBg.classList.remove('cleared');
      cloudsLayer.classList.remove('cleared');

      // Stop plane animation
      planeWrap.classList.remove('flying');

      // Restore prompt button after clouds close back
      setTimeout(() => {
        clickPrompt.classList.remove('hidden');
      }, 800);
    }

    // Allow clicking the prompt button directly
    clickPrompt.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerClearSequence();
    });

    // Also allow clicking anywhere on the screen when skies are overcast
    window.addEventListener('click', () => {
      if (!isRevealed) {
        triggerClearSequence();
      }
    });

    // Replay button click
    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetToCloudyState();
    });
  </script>
</body>
</html>
