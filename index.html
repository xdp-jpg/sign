<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Message</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: linear-gradient(180deg, #3a88e9 0%, #7ec6f8 65%, #cde9fc 100%);
      position: relative;
    }

    /* 1. THE HIDDEN MESSAGE (z-index: 1) */
    .message-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #ffffff;
      z-index: 1;
      width: 90%;
      max-width: 600px;
      opacity: 0;
      transition: opacity 2s ease 0.8s, transform 2s ease 0.8s;
      transform: translate(-50%, -45%);
      pointer-events: none;
    }

    .message-container.revealed {
      opacity: 1;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }

    .message-container h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(0, 40, 100, 0.25);
      margin-bottom: 12px;
    }

    .message-container p {
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 400;
      opacity: 0.95;
      text-shadow: 0 2px 10px rgba(0, 40, 100, 0.2);
    }

    /* 2. THE CLOUD COVER (z-index: 2) */
    .cloud-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .cloud-part {
      position: absolute;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.98) 40%, rgba(240, 248, 255, 0.85) 75%, transparent 100%);
      border-radius: 50%;
      filter: blur(25px);
      transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 3s ease;
    }

    /* Left and Right Cloud Masses */
    .cloud-left-1 { width: 75vw; height: 75vw; top: -15vh; left: -25vw; }
    .cloud-left-2 { width: 60vw; height: 60vw; bottom: -10vh; left: -20vw; }
    .cloud-right-1 { width: 70vw; height: 70vw; top: -10vh; right: -25vw; }
    .cloud-right-2 { width: 65vw; height: 65vw; bottom: -15vh; right: -20vw; }
    .cloud-center { width: 80vw; height: 50vh; top: 25vh; left: 10vw; }

    /* Parting animation triggered by JS */
    .cleared .cloud-left-1 { transform: translate(-60vw, -40vh); opacity: 0; }
    .cleared .cloud-left-2 { transform: translate(-60vw, 40vh); opacity: 0; }
    .cleared .cloud-right-1 { transform: translate(60vw, -40vh); opacity: 0; }
    .cleared .cloud-right-2 { transform: translate(60vw, 40vh); opacity: 0; }
    .cleared .cloud-center { transform: scale(1.4); opacity: 0; }

    /* 3. THE AIRPLANE & FLIGHT PATH (z-index: 3) */
    .flight-path {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .airplane {
      position: absolute;
      width: 70px;
      height: 70px;
      top: 60%;
      left: -100px;
      transform: rotate(20deg);
      animation: flyAcross 4.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .airplane svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
      filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.18));
    }

    @keyframes flyAcross {
      0% {
        left: -100px;
        top: 65%;
        transform: rotate(22deg) scale(0.85);
      }
      50% {
        top: 38%;
        transform: rotate(14deg) scale(1.05);
      }
      100% {
        left: 110vw;
        top: 15%;
        transform: rotate(8deg) scale(0.95);
      }
    }

    /* REPLAY BUTTON */
    .replay-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: white;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      transition: opacity 1s ease 2s, background 0.2s, transform 0.2s;
    }

    .replay-btn.visible {
      opacity: 1;
    }

    .replay-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateX(-50%) scale(1.05);
    }
  </style>
</head>
<body>

  <!-- The Hidden Message (change your text here) -->
  <div class="message-container" id="msg">
    <h1>Pare ton Niko</h1>
  </div>

  <!-- Clouds -->
  <div class="cloud-overlay" id="clouds">
    <div class="cloud-part cloud-left-1"></div>
    <div class="cloud-part cloud-left-2"></div>
    <div class="cloud-part cloud-right-1"></div>
    <div class="cloud-part cloud-right-2"></div>
    <div class="cloud-part cloud-center"></div>
  </div>

  <!-- Airplane Layer -->
  <div class="flight-path" id="flightPath">
    <div class="airplane" id="plane">
      <!-- Minimalist Vector Jet -->
      <svg viewBox="0 0 24 24">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
    </div>
  </div>

  <!-- Replay Button -->
  <button class="replay-btn" id="replayBtn" onclick="runAnimation()">Replay Animation</button>

  <script>
    function runAnimation() {
      const clouds = document.getElementById('clouds');
      const msg = document.getElementById('msg');
      const plane = document.getElementById('plane');
      const btn = document.getElementById('replayBtn');

      // Reset states
      clouds.classList.remove('cleared');
      msg.classList.remove('revealed');
      btn.classList.remove('visible');
      plane.style.animation = 'none';
      void plane.offsetWidth; // Force CSS reflow

      // Re-trigger flight
      plane.style.animation = 'flyAcross 4.5s cubic-bezier(0.4, 0, 0.2, 1) forwards';

      // Part clouds when plane reaches midpoint (~1.2s in)
      setTimeout(() => {
        clouds.classList.add('cleared');
        msg.classList.add('revealed');
        btn.classList.add('visible');
      }, 1200);
    }

    // Run automatically when the webpage loads
    window.addEventListener('DOMContentLoaded', () => {
      runAnimation();
    });
  </script>
</body>
</html>
